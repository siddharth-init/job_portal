{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Post New Job
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Job Title
                        </label>

                        {{ form.title }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Company Name
                        </label>

                        {{ form.company_name }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        {{ form.location }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Salary
                        </label>

                        {{ form.salary }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        {{ form.description }}

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Post Job

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
