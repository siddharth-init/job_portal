{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <!-- Heading -->

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">

                            Welcome Back

                        </h2>

                        <p class="text-muted">

                            Login to your Job Portal account

                        </p>

                    </div>

                    <!-- Login Form -->

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required>

                        </div>

                        <!-- Password -->

                        <div class="mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>

                        </div>

                        <!-- Submit -->

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg rounded-3">

                                Login

                            </button>

                        </div>

                    </form>

                    <!-- Register Link -->

                    <div class="text-center mt-4">

                        <p class="mb-0">

                            Don't have an account?

                            <a
                                href="{% url 'register' %}"
                                class="text-decoration-none fw-bold">

                                Register

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
